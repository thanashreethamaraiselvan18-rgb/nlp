services:
  api:
    build:
      context: ./backend
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./backend/data:/app/data"]
  dashboard:
    build:
      context: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on: [api]
